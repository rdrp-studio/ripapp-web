<style>

  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--text)}

var LANGS=["es","en","de","fr","it","pt"], menu=document.getElementById("lang-menu"), btn=document.getElementById("lang-btn");
LANGS.forEach(function(l){
  var b=document.createElement("button"); b.type="button"; b.dataset.code=l;
  b.innerHTML='<span class="flag">'+FLAGS[l]+'</span><span>'+P[l]._name+'</span>';
  b.addEventListener("click",function(){ setLang(l,true); menu.hidden=true; btn.setAttribute("aria-expanded","false"); });
  menu.appendChild(b);
});
btn.addEventListener("click",function(e){ e.stopPropagation(); menu.hidden=!menu.hidden; btn.setAttribute("aria-expanded",String(!menu.hidden)); });
document.addEventListener("click",function(e){ if(!menu.hidden && !menu.contains(e.target)) menu.hidden=true; });
document.addEventListener("keydown",function(e){ if(e.key==="Escape") menu.hidden=true; });

function setLang(l,remember){
  if(!P[l]) l="es"; var t=P[l];
  document.documentElement.lang=l; document.title=t.title;
  var h='<div class="eyebrow">'+t.eyebrow+'</div><h1>'+t.h1+'</h1><div class="updated">'+t.updated+'</div><div class="summary">'+t.summary+'</div>';
  t.s.forEach(function(x){ h+='<h2>'+x[0]+'</h2>'+x[1]; });
  h+='<p class="contact">'+EMAIL+'</p><p>RDRP Studio</p>';
  document.getElementById("doc").innerHTML=h;
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent=t[el.getAttribute("data-t")]; });
  document.getElementById("lang-flag").innerHTML=FLAGS[l];
  document.getElementById("lang-name").textContent=t._name;
  menu.querySelectorAll("button").forEach(function(b){ b.setAttribute("aria-current",String(b.dataset.code===l)); });
  if(remember){ try{ localStorage.setItem("ripapp-lang",l); }catch(e){} }
}
var start=null;
var q=(location.hash||"").replace("#","");
if(LANGS.indexOf(q)>=0) start=q;
if(!start){ try{ start=localStorage.getItem("ripapp-lang"); }catch(e){} }
if(!start){ var n=(navigator.languages&&navigator.languages[0])||navigator.language||"es"; start=n.slice(0,2).toLowerCase(); }
setLang(LANGS.indexOf(start)>=0?start:"es",false);
})();
